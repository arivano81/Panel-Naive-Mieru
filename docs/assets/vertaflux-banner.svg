<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">VertaFlux — one control plane, multiple routes</title>
  <desc id="desc">Green and blue network paths converge into the VertaFlux control plane and continue through a secure gateway.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050a10"/>
      <stop offset="0.55" stop-color="#07131a"/>
      <stop offset="1" stop-color="#04110e"/>
    </linearGradient>
    <linearGradient id="flux" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#16e0a1"/>
      <stop offset="0.55" stop-color="#2bd7ff"/>
      <stop offset="1" stop-color="#247cff"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#16e0a1" stop-opacity=".2"/>
      <stop offset="1" stop-color="#16e0a1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#4cdcff" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <circle cx="965" cy="156" r="250" fill="url(#halo)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M52 82H185C230 82 246 120 292 120H390" stroke="#16e0a1" stroke-width="3" opacity=".75"/>
    <path d="M52 144H205C245 144 258 144 292 144H390" stroke="#2bd7ff" stroke-width="3" opacity=".75"/>
    <path d="M52 206H185C230 206 246 168 292 168H390" stroke="#247cff" stroke-width="3" opacity=".75"/>
    <path d="M810 144H905C950 144 966 108 1012 108H1148" stroke="url(#flux)" stroke-width="4" filter="url(#glow)"/>
    <path d="M810 168H905C950 168 966 204 1012 204H1148" stroke="url(#flux)" stroke-width="4" opacity=".7"/>
  </g>

  <g fill="#07131a" stroke-width="2">
    <circle cx="52" cy="82" r="7" stroke="#16e0a1"/>
    <circle cx="52" cy="144" r="7" stroke="#2bd7ff"/>
    <circle cx="52" cy="206" r="7" stroke="#247cff"/>
    <circle cx="1148" cy="108" r="7" stroke="#2bd7ff"/>
    <circle cx="1148" cy="204" r="7" stroke="#16e0a1"/>
  </g>

  <g transform="translate(390 58)">
    <rect width="420" height="194" rx="28" fill="#091820" stroke="url(#flux)" stroke-width="2"/>
    <path d="M48 53l22-13 22 13v26L70 92 48 79z" fill="none" stroke="url(#flux)" stroke-width="3"/>
    <path d="M58 59l12-7 12 7v14l-12 7-12-7z" fill="#16e0a1" opacity=".85"/>
    <text x="112" y="78" fill="#f2f7fa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700" letter-spacing="1">VertaFlux</text>
    <rect x="48" y="112" width="324" height="1" fill="url(#flux)" opacity=".45"/>
    <text x="48" y="146" fill="#a8bbc6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" textLength="324" lengthAdjust="spacingAndGlyphs">ONE CONTROL PLANE · MULTIPLE ROUTES</text>
    <text x="48" y="174" fill="#53e4c0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Naive · Mieru · Hysteria2 · VLESS · OpenFlux</text>
  </g>
</svg>
