name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel-tests:
    name: Panel tests (Node.js 20)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Generate and validate release SBOM
        working-directory: .
        env:
          SBOM_CREATED: '2026-01-01T00:00:00Z'
        run: |
          node tools/generate-sbom.js dist/rixxx-panel.spdx.json
          node tests/sbom.test.js

  debian:
    name: Debian ${{ matrix.release }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: debian:${{ matrix.release }}-slim
    strategy:
      fail-fast: false
      matrix:
        release: ['12', '13']
    steps:
      - name: Install runner prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git jq openssl shellcheck sqlite3 unzip xz-utils python3 make g++
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - name: Install dependencies
        working-directory: panel
        run: npm ci
      - name: Run regression suite
        working-directory: panel
        run: npm test
      - name: Check Bash syntax
        run: |
          find . -type f -name '*.sh' -not -path './panel/node_modules/*' -print0 |
            xargs -0 -n1 bash -n
      - name: Validate pinned Xray binary and generated config
        if: matrix.release == '13'
        run: bash tests/xray-binary-canary.sh
      - name: Validate pinned OpenFlux encrypted Direct tunnel
        if: matrix.release == '13'
        run: bash tests/openflux-binary-canary.sh
      - name: Test rollback lifecycle
        run: bash tests/rollback-lifecycle.sh
      - name: Run ShellCheck (errors only)
        run: |
          find . -type f -name '*.sh' -not -path './panel/node_modules/*' -print0 |
            xargs -0 shellcheck --severity=error
